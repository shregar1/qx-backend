    <script>
      // Set the initial theme class synchronously so the first paint
      // doesn't flash the wrong colour scheme. Default is dark — only
      // a previous *explicit* "light" choice (saved by the toggle to
      // localStorage) opts out. We intentionally don't consult
      // `prefers-color-scheme` here: every sibling broker product
      // ships dark-default, and the dashboard mirrors that.
      (function () {
        try {
          var saved = localStorage.getItem("qx-theme");
          if (saved !== "light") document.documentElement.classList.add("dark");
        } catch (_) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
