[package]
name = "qxd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "QX — broker, dashboard, and admin API in one binary"

[dependencies]
qx-broker = { path = "../broker" }
qx-workflow = { path = "../workflow" }
tokio.workspace = true
serde = { version = "1", features = ["derive"] }
toml.workspace = true
clap.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "process"] }
tempfile.workspace = true
rcgen = "0.13"

[[bin]]
name = "qx"
path = "src/main.rs"
